# 평일 장마감 후 전 종목 스냅샷을 갱신해 커밋한다.
#   국내: snapshot.json (네이버증권)
#   해외·코인: us.json·jp.json·coins.json (나스닥·야후 파이낸스·업비트·코인게코) - 실패해도 국내는 커밋
# 커밋이 생기면 Workers Builds 가 자동으로 테스트 후 배포한다.
name: daily-snapshot

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 07:40 UTC = 16:40 KST (장마감 15:30 이후)
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        run: python scripts/build_snapshot.py
      - name: Build global (US·JP·coin)
        continue-on-error: true
        run: |
          pip install --quiet requests selectolax
          python scripts/build_global.py
      - name: Commit if changed
        run: |
          git config user.name "moastock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/snapshot.json public/data/us.json public/data/jp.json public/data/coins.json
          if git diff --cached --quiet; then
            echo "변경 없음 (휴장일 가능)"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%d)"
            # 그사이 다른 커밋이 올라왔으면 그 위에 얹어서 올린다 (2026-10-07 실패 원인)
            for i in 1 2 3; do
              git pull --rebase --quiet origin main && git push && break
              sleep 5
            done
          fi
