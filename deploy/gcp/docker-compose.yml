# AI 비서 GPU 서버 (GCP T4 1장 VM 한 대). 모든 포트는 VM 안(127.0.0.1)에만 열고,
# 바깥(사이트 Worker)과는 Cloudflare 터널로만 잇는다 - 공개 IP로 들어오는 길이 없다.
#
#   llm        Qwen3.5 4B, vLLM (OpenAI 호환 API)          :8000
#   embed      multilingual-e5-small, TEI (임베딩 API)      :8081
#   db         PostgreSQL 18 + pgvector (뉴스·공시 청크)     :5432
#   assistant  LangGraph 오케스트레이터 (FastAPI, SSE)       :8100
#   tunnel     cloudflared (TUNNEL_TOKEN 이 있을 때)
#
# GPU 메모리(T4 16GB): vLLM 0.80(모델 ~8.7GB + 문맥 캐시) + TEI ~1GB
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

services:
  llm:
    image: vllm/vllm-openai:v0.31.0
    <<: *gpu
    restart: always
    ipc: host
    volumes: [/data/hf:/root/.cache/huggingface]
    ports: ["127.0.0.1:8000:8000"]
    # T4는 BF16이 없어 FP16(half). 이미지 입력은 쓰지 않으므로 언어 모델 부분만 올린다.
    command: >
      --model Qwen/Qwen3.5-4B --served-model-name qwen3.5-4b
      --dtype half --max-model-len 16384 --gpu-memory-utilization 0.80
      --max-num-seqs 16 --language-model-only
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/health"]
      interval: 30s
      start_period: 15m

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.9.4
    <<: *gpu
    restart: always
    volumes: [/data/hf-tei:/data]
    ports: ["127.0.0.1:8081:80"]
    command: >
      --model-id intfloat/multilingual-e5-small
      --max-client-batch-size 256 --max-batch-tokens 65536

  db:
    image: pgvector/pgvector:0.8.1-pg18
    restart: always
    shm_size: 2g
    environment: { POSTGRES_USER: moarag, POSTGRES_PASSWORD: moarag, POSTGRES_DB: moarag }
    volumes: [/data/pg:/var/lib/postgresql, /data/dump:/dump]
    ports: ["127.0.0.1:5432:5432"]
    command: >
      postgres -c shared_buffers=6GB -c effective_cache_size=16GB
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=3
      -c work_mem=64MB -c max_wal_size=8GB

  assistant:
    build: { context: ../.., dockerfile: deploy/gcp/Dockerfile.assistant }
    restart: always
    depends_on: [db, embed]
    environment:
      ASSIST_LLM_BASE_URL: http://llm:8000/v1
      ASSIST_PG_DSN: postgresql://moarag:moarag@db:5432/moarag
      MOARAG_EMBED_URL: http://embed:80
      MOARAG_DATA_DIR: /data/rag          # 남은 청크 덧붙이기(moarag.backfill)용 파일
      MOARAG_PG_DSN: postgresql://moarag:moarag@db:5432/moarag
      ASSIST_SHARED_SECRET: ${ASSIST_SHARED_SECRET:?ASSIST_SHARED_SECRET 를 .env 에 넣으세요}
    volumes: [/data/rag:/data/rag]
    ports: ["127.0.0.1:8100:8100"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    network_mode: host                # 터널 → 127.0.0.1:8100 (오케스트레이터)
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}" }
    profiles: [tunnel]
