# 모아스톡 - Cloudflare Worker 하나: 정적 페이지 + API + 실시간 채팅(Durable Objects)
#   로컬:  npx wrangler dev
#   배포:  npx wrangler deploy   (main 푸시 시 Workers Builds가 npm test 후 자동 배포)
name = "moastock"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 도메인: Worker 사용자 지정 도메인 (DNS 레코드·인증서는 Cloudflare가 자동 관리)
routes = [
  { pattern = "moastock.co.kr", custom_domain = true },
  { pattern = "www.moastock.co.kr", custom_domain = true },
]

# 정적 파일: /api/* 만 Worker 코드가 먼저 받고, 나머지는 public/ 파일을 바로 내보낸다
# (/stock → stock.html 처럼 확장자 없는 주소도 처리)
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"

# 종목 토론방 저장소 (src/api/board.js)
[[d1_databases]]
binding = "BOARD_DB"
database_name = "moastock-board"
database_id = "498f2b60-d42e-4b64-8b08-322a24d91281"

# 실시간 채팅 (src/chat/*) - 로비 1개 + 방마다 1개
[[durable_objects.bindings]]
name = "CHAT_LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# 무료 플랜은 SQLite 저장 방식 DO만 쓸 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "ChatRoom"]

# 비밀값: DART_API_KEY  →  npx wrangler secret put DART_API_KEY
# 로컬 개발은 .dev.vars 에서 읽는다

# AI 비서 GPU 서버(GCP) - Cloudflare 터널을 통한 비공개 연결 (공개 주소 없음)
[[vpc_services]]
binding = "ASSIST_VPC"
service_id = "01a11537-664d-73c3-89b7-73a1eda8c604"

[vars]
ASSIST_HOURS = "15-22"   # AI 비서 운영 시간 (KST, 시작-끝). GCP 서버도 이 시간에 맞춰 자동으로 켜지고 꺼진다
